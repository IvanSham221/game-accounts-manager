<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Менеджер аккаунтов</title>
    <link rel="stylesheet" href="style.css?v=20250115">
</head>
<body>
    <div class="login-container">
        <div class="login-form">
            <h1>🔐 Вход в систему</h1>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Логин:</label>
                    <input type="text" id="username" required class="input" placeholder="Логин" autocomplete="username">
                </div>
                
                <div class="input-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" required class="input" placeholder="Пароль" autocomplete="current-password">
                </div>
                
                <div id="loginError" class="error-message" style="display: none;"></div>
                
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    Войти
                </button>
                
                <div id="loadingStatus" style="display: none; text-align: center; margin-top: 15px; color: #64748b; font-size: 0.9em;">
                    <span>⏳ Загрузка...</span>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="firebase.js"></script>
    <script src="security.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // ===== 1. ПРОВЕРКА СЕССИИ =====
        if (security.isSessionValid()) {
            window.location.href = 'manager.html';
            return;
        }
        
        // ===== 2. ИНИЦИАЛИЗАЦИЯ =====
        console.log('🔐 Страница входа загружена');
        
        // Получаем элементы
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorDiv = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        const loadingStatus = document.getElementById('loadingStatus');
        
        // ===== 3. ЗАГРУЖАЕМ ТОЛЬКО РАБОТНИКОВ (для входа) =====
        async function loadWorkersOnly() {
            console.log('👷 Загружаем работников для входа...');
            
            try {
                // Пытаемся загрузить из Firebase
                if (firebase && firebase.database) {
                    const snapshot = await firebase.database().ref('workers').once('value');
                    if (snapshot.exists()) {
                        const workersObj = snapshot.val();
                        const workersArray = Object.values(workersObj || {});
                        localStorage.setItem('workers', JSON.stringify(workersArray));
                        console.log(`✅ Загружено ${workersArray.length} работников`);
                        return workersArray;
                    }
                }
                
                // Если Firebase недоступен - берем из кеша
                const cached = JSON.parse(localStorage.getItem('workers')) || [];
                console.log(`📂 Загружено из кеша: ${cached.length} работников`);
                return cached;
                
            } catch (error) {
                console.warn('⚠️ Ошибка загрузки работников:', error);
                return JSON.parse(localStorage.getItem('workers')) || [];
            }
        }
        
        // ===== 4. ОБРАБОТЧИК ВХОДА =====
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Скрываем старые ошибки
            errorDiv.style.display = 'none';
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            if (!username || !password) {
                errorDiv.textContent = 'Заполните все поля';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Блокируем кнопку
            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ Загрузка...';
            loadingStatus.style.display = 'block';
            
            try {
                // ===== ЗАГРУЖАЕМ ТОЛЬКО РАБОТНИКОВ (БЕЗ ПРОДАЖ!) =====
                await loadWorkersOnly();
                
                // Проверяем логин
                const result = security.validateLogin(username, password);
                
                if (result.success) {
                    console.log(`✅ Пользователь ${result.user.name} вошел`);
                    
                    // Сохраняем сессию
                    security.startSession(result.user);
                    
                    // Показываем статус
                    loadingStatus.innerHTML = '✅ Вход выполнен, перенаправление...';
                    
                    // Переходим на главную (данные подгрузятся там)
                    setTimeout(() => {
                        window.location.href = 'manager.html';
                    }, 300);
                    
                } else {
                    errorDiv.textContent = '❌ Неверный логин или пароль';
                    errorDiv.style.display = 'block';
                    
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Войти';
                    loadingStatus.style.display = 'none';
                }
                
            } catch (error) {
                console.error('❌ Ошибка входа:', error);
                errorDiv.textContent = '❌ Ошибка соединения. Проверьте интернет.';
                errorDiv.style.display = 'block';
                
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
                loadingStatus.style.display = 'none';
            }
        });
        
        // ===== 5. ВХОД ПО ENTER =====
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });
        
        // ===== 6. АВТОФОКУС =====
        setTimeout(() => {
            if (usernameInput) usernameInput.focus();
        }, 300);
        
        console.log('✅ Страница входа готова');
    });
    </script>
    
    <style>
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            font-size: 0.95em;
        }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .login-form {
            background: white;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.5s ease;
        }
        .login-form h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2d3748;
            font-size: 1.8em;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #4a5568;
            font-size: 0.95em;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f7fafc;
        }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }
        .btn-block {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-block:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        .btn-block:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #loadingStatus {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
    </style>
</body>
</html>
